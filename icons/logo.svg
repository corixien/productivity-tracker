    <rect width="1024" height="1024" fill="url(#glow)"/>
    <path d="M0 0H1024V400C800 500 224 500 0 400Z" fill="url(#shine)"/>
    <g transform="translate(512 512) scale(1.0) translate(-512 -512)">
      <circle cx="512" cy="512" r="270" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.28" stroke-width="64"/>
      <circle cx="512" cy="512" r="270" fill="none" stroke="url(#mark)" stroke-width="64" stroke-linecap="round"
